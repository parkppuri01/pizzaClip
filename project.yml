name: myclip
options:
  bundleIdPrefix: com.jekeun
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
targets:
  myclip:
    type: application
    platform: macOS
    sources:
      - path: myclip
    info:
      path: myclip/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: myclip
        CFBundleDisplayName: myclip
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
        LSMinimumSystemVersion: "13.0"
        NSAppleEventsUsageDescription: "myclip uses Apple events to paste into the previous application."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jekeun.myclip
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: myclip/Info.plist
    dependencies:
      - package: GRDB
        product: GRDB
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
  myclipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: myclipTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jekeun.myclipTests
    dependencies:
      - target: myclip
schemes:
  myclip:
    build:
      targets:
        myclip: all
        myclipTests: [test]
    test:
      targets:
        - myclipTests
