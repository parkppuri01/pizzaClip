name: HotSauce
options:
  bundleIdPrefix: com.Team-jAm
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.4.0"
    # 빌드 7 = 직접배포 1.2.0(라이브), 8 = 앱스토어 첫 업로드(옛 아이콘·토글 없음, 소진).
    # 9 = 앱스토어 1.3.0 (macOS 규격 아이콘 + 배너 토글 포함) — 2026-08-25 출시.
    # 10 = 직접배포 1.3.0 = 직접배포 채널 **마지막 빌드** (+ App Store 이전 안내).
    #      버전 문자열은 앱스토어와 같은 1.3.0 으로 맞췄다.
    # 11 = 앱스토어 1.4.0 — 얼굴 아이콘 세트 4종 + 메뉴바 연타 이스터에그 +
    #      폭죽 다듬기 + 빨강 임계치 3 + 첫 실행 기본값. 기능이 여럿이라 minor↑.
    CURRENT_PROJECT_VERSION: "11"
    # Manual + Developer ID gives a STABLE code signature so macOS TCC remembers
    # granted permissions across rebuilds. Ad-hoc dev signatures change every
    # build → grants never stick. Team ID + identity live in Signing.xcconfig
    # (gitignored) — see Signing.xcconfig.example.
    CODE_SIGN_STYLE: Manual
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

# ─────────────────────────────────────────────────────────────────────────────
#  타깃 2개 = 배포 경로 2개. 소스는 같고, 빌드 조건으로 갈린다.
#
#   HotSauce      직접 배포 — Developer ID 서명 + 공증 DMG + Sparkle 자동 업데이트
#   HotSauce-MAS  앱스토어 — App Sandbox + Sparkle 없음 (App Store 가 업데이트 담당)
#
#  코드에서 갈라지는 지점은 `#if MAS` 하나뿐이다(AppDelegate · StatusItemController
#  · SettingsView). MAS 타깃만 SWIFT_ACTIVE_COMPILATION_CONDITIONS 에 MAS 를 준다.
#
#  ⚠️ 두 타깃 모두 산출물 이름이 HotSauce.app 이라 같은 derivedDataPath 로 빌드하면
#     서로 덮어쓴다. 반드시 빌드 폴더를 나눌 것 (build/ vs build-mas/ — 아래 참고).
# ─────────────────────────────────────────────────────────────────────────────
targets:
  HotSauce:
    type: application
    platform: macOS
    sources:
      - path: HotSauce
        excludes:
          - Resources/Info-MAS.plist
          # 툴링 상태 폴더가 소스 트리에 섞여도 번들에 딸려가지 않게 막는다.
          # (실제로 1.1.3 까지 .omc/state 의 jsonl·json 이 앱 Resources 에 배포됐다)
          - "**/.omc"
          - "**/.omc/**"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Team-jAm.HotSauce
        PRODUCT_NAME: HotSauce
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HotSauce/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        CODE_SIGN_ENTITLEMENTS: HotSauce/HotSauce.entitlements
      configs:
        Release:
          # Prevent Xcode from auto-injecting get-task-allow (notarization rejects it).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: Sparkle
        product: Sparkle
    postBuildScripts:
      - name: Strip extended attributes
        script: |
          # 번들 안 파일에 붙은 확장속성(xattr)을 전부 턴다.
          # 자세한 이유는 HotSauce-MAS 타깃의 같은 스크립트 주석 참고.
          # 코드 서명은 모든 빌드 페이즈 "뒤"에 돌므로 서명을 깨지 않는다.
          xattr -cr "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
        basedOnDependencyAnalysis: false

  HotSauce-MAS:
    type: application
    platform: macOS
    sources:
      - path: HotSauce
        excludes:
          - Resources/Info.plist
          - "**/.omc"
          - "**/.omc/**"
    # 앱스토어는 Apple Distribution 인증서 + Mac App Store 프로비저닝 프로파일이
    # 필요하다. Developer ID 를 담은 Signing.xcconfig 를 쓰면 안 되므로 별도 파일.
    configFiles:
      Debug: Signing-MAS.xcconfig
      Release: Signing-MAS.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Team-jAm.HotSauce
        PRODUCT_NAME: HotSauce
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HotSauce/Resources/Info-MAS.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: HotSauce/HotSauce-MAS.entitlements
        # 프로젝트 공통값(Manual/Developer ID)을 타깃 레벨에서 덮어쓴다.
        # 앱스토어는 Xcode 가 인증서·프로비저닝 프로파일을 관리하게 두는 편이 안전하다.
        #
        # ⚠️ CODE_SIGN_IDENTITY 를 여기에 쓰지 말 것.
        #   XcodeGen 은 CODE_SIGN_STYLE: Automatic 인 타깃에
        #   "CODE_SIGN_IDENTITY[sdk=macosx*]" = "Apple Development" 를 자동으로 넣는다.
        #   Xcode 에서는 조건부([sdk=...]) 설정이 무조건부보다 우선하므로, 여기에
        #   "Apple Distribution" 을 써도 macOS 빌드에서는 절대 적용되지 않고 오히려
        #   ad-hoc(-) 서명으로 떨어져 아카이브에 팀이 안 박힌다
        #   → Organizer 에서 "No Team Found in Archive" 로 배포가 막힌다. (2026-08-14 실제 발생)
        #   자동 서명에 맡기고, 배포용 인증서는 Distribute App 단계에서 Xcode 가 고르게 둔다.
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG MAS
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: MAS
    # Sparkle 의존성 없음 — 앱스토어 앱의 자체 업데이트는 심사 리젝 사유다.
    postBuildScripts:
      - name: Strip extended attributes
        script: |
          # 🚨 앱스토어 업로드 거부를 막는 필수 단계 (2026-08-14 실제 거부됨).
          #   ITMS-91109: Invalid package contents — 번들 안 파일에 com.apple.quarantine
          #   확장속성이 붙어 있으면 App Store / TestFlight 배포가 거부된다.
          #   디자인 PNG 를 Finder·다운로드 경유로 넣으면 quarantine 이 따라오고,
          #   macOS 15+ 는 파일 접근만 해도 com.apple.provenance 를 다시 붙인다.
          #   → 소스를 한 번 청소하는 걸로는 재발을 못 막으므로 빌드마다 턴다.
          #   코드 서명은 모든 빌드 페이즈 "뒤"에 돌므로 서명을 깨지 않는다.
          xattr -cr "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
        basedOnDependencyAnalysis: false

schemes:
  HotSauce:
    build:
      targets:
        HotSauce: all
    run:
      config: Debug
  HotSauce-MAS:
    build:
      targets:
        HotSauce-MAS: all
    run:
      config: Debug
